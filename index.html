<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jewelzae — Kavling Car-Free di Cisauk, Tangerang</title>
  <meta name="description" content="Jewelzae menghadirkan kawasan car-free yang ramah keluarga di Cisauk — Tangerang. Kavling 100 m² mulai Rp 500 Juta atau Rp 5 juta / bulan." />
  <meta name="theme-color" content="#1f3a2e" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%231f3a2e' d='M16 2 L24 16 L16 30 L8 16 Z'/%3E%3Cpath fill='%23c9a96e' d='M16 8 L20 16 L16 24 L12 16 Z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="canvas" id="top">
    <img class="mock" src="jewelzae-mock.jpg" alt="Jewelzae — kawasan kavling car-free di Cisauk, Tangerang" />

    <!-- Section anchors aligned to image regions -->
    <span class="anchor" id="beranda"  style="--y: 0%"></span>
    <span class="anchor" id="tentang"  style="--y: 75%"></span>
    <span class="anchor" id="fasilitas" style="--y: 38%"></span>
    <span class="anchor" id="lokasi"   style="--y: 73%"></span>
    <span class="anchor" id="harga"    style="--y: 30%"></span>
    <span class="anchor" id="kontak"   style="--y: 90%"></span>

    <!-- Click hotspots (left%, top%, width%, height%) -->
    <a class="hot" href="#beranda"   aria-label="Beranda"  style="--x:2;  --y:1;    --w:19; --h:3"></a>
    <a class="hot" href="#beranda"   aria-label="Beranda"  style="--x:39; --y:0.5;  --w:7;  --h:3.5"></a>
    <a class="hot" href="#tentang"   aria-label="Tentang"  style="--x:47; --y:0.5;  --w:7;  --h:3.5"></a>
    <a class="hot" href="#fasilitas" aria-label="Fasilitas" style="--x:55; --y:0.5; --w:8;  --h:3.5"></a>
    <a class="hot" href="#lokasi"    aria-label="Lokasi"   style="--x:64; --y:0.5;  --w:7;  --h:3.5"></a>
    <a class="hot" href="#harga"     aria-label="Harga"    style="--x:72; --y:0.5;  --w:7;  --h:3.5"></a>
    <a class="hot" href="#kontak"    aria-label="Kontak"   style="--x:80; --y:0.5;  --w:11; --h:3.5"></a>

    <!-- Hero CTAs -->
    <a class="hot" data-action="survey"   aria-label="Jadwalkan Survey"
       href="https://wa.me/6281234567890?text=Halo%20Jewelzae%2C%20saya%20mau%20jadwalkan%20survey%20kavling."
       target="_blank" rel="noopener"
       style="--x:5;  --y:24.8; --w:17; --h:3.4"></a>
    <a class="hot" data-action="whatsapp" aria-label="Chat WhatsApp"
       href="https://wa.me/6281234567890?text=Halo%20Jewelzae%2C%20saya%20tertarik%20dengan%20kavling%20Anda."
       target="_blank" rel="noopener"
       style="--x:23; --y:24.8; --w:14.5; --h:3.4"></a>

    <!-- Visi Kawasan CTA -->
    <a class="hot" data-action="survey"   aria-label="Pelajari Lebih Lanjut"
       href="https://wa.me/6281234567890?text=Halo%20Jewelzae%2C%20saya%20mau%20info%20lengkap%20site%20plan%20kawasan."
       target="_blank" rel="noopener"
       style="--x:5;  --y:78.6; --w:17; --h:3"></a>

    <!-- Final CTA banner -->
    <a class="hot" data-action="survey"   aria-label="Jadwalkan Survey Sekarang"
       href="https://wa.me/6281234567890?text=Halo%20Jewelzae%2C%20saya%20mau%20jadwalkan%20survey%20sekarang."
       target="_blank" rel="noopener"
       style="--x:64; --y:92;   --w:29; --h:3.5"></a>

    <!-- Updated price overlay (covers the original 'Rp 200 Juta' card) -->
    <div class="price-card" aria-label="Harga kavling">
      <div class="leaf">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2 L19 9 L12 16 L5 9 Z" fill="#e8efe5" stroke="#1f3a2e" stroke-width="1.2"/>
          <path d="M12 9 L15 12 L12 15 L9 12 Z" fill="#1f3a2e" opacity=".55"/>
        </svg>
      </div>
      <div class="text">
        <div class="label">Kavling 100 m² mulai</div>
        <div class="amount">Rp 500 Juta</div>
        <div class="sub">atau <strong>Rp 5 juta&thinsp;/&thinsp;bulan</strong></div>
      </div>
    </div>

    <!-- Floating WhatsApp pill (always visible, follows scroll) -->
    <a class="wa-fab"
       href="https://wa.me/6281234567890?text=Halo%20Jewelzae%2C%20saya%20tertarik%20dengan%20kavling%20Anda."
       target="_blank" rel="noopener" aria-label="Chat WhatsApp">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="#fff" aria-hidden="true">
        <path d="M20.52 3.48A11.94 11.94 0 0 0 12 0C5.37 0 0 5.37 0 12a11.94 11.94 0 0 0 1.64 6.06L0 24l6.13-1.61A11.94 11.94 0 0 0 12 24c6.63 0 12-5.37 12-12 0-3.2-1.25-6.21-3.48-8.52zM12 22a10 10 0 0 1-5.1-1.39l-.36-.21-3.64.95.97-3.55-.24-.37A10 10 0 1 1 22 12a10 10 0 0 1-10 10zm5.45-7.3c-.3-.15-1.77-.87-2.04-.97s-.47-.15-.67.15-.77.97-.94 1.16-.34.22-.64.07a8.16 8.16 0 0 1-2.4-1.48 9 9 0 0 1-1.66-2.07c-.17-.3 0-.46.13-.6s.3-.34.45-.52a2 2 0 0 0 .3-.5.55.55 0 0 0 0-.52c-.08-.15-.67-1.6-.92-2.2-.24-.58-.49-.5-.67-.5h-.57a1.1 1.1 0 0 0-.8.37 3.34 3.34 0 0 0-1.04 2.49c0 1.46 1.07 2.88 1.22 3.08s2.1 3.2 5.08 4.49a17 17 0 0 0 1.7.63 4.1 4.1 0 0 0 1.86.12 3.05 3.05 0 0 0 2-1.41 2.49 2.49 0 0 0 .17-1.41c-.07-.13-.27-.2-.57-.35z"/>
      </svg>
      <span>WhatsApp</span>
    </a>
  </main>

  <script>
    // Smooth scroll: account for image being a single canvas
    document.querySelectorAll('a.hot[href^="#"]').forEach(a => {
      a.addEventListener('click', e => {
        const id = a.getAttribute('href').slice(1);
        const el = document.getElementById(id);
        if (!el) return;
        e.preventDefault();
        const rect = el.getBoundingClientRect();
        const top = window.scrollY + rect.top - 12;
        window.scrollTo({ top, behavior: 'smooth' });
      });
    });
  </script>
</body>
</html>
